apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: default
  labels:
    app: hello-world
spec:
  selector:
    matchLabels:
      app:hello-world
  replicas: .{{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name: hello-world
        image:  {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
         - name: http
           containerPort: 80
           protocol: TCP